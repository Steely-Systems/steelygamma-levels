name: archive levels
# Keeps every published latest.json on the `archive` branch as archive/YYYY-MM-DD-<stage>.json, with index.json listing them, so the
# levels can be checked against what the market did later. Runs when latest.json changes on main; it never commits to main, so the
# publisher's pushes to main are unaffected.
on:
  push:
    branches: [main]
    paths: [latest.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: main
      - uses: actions/checkout@v5
        with:
          ref: archive
          path: archive
      - name: Copy latest.json into the archive
        run: |
          set -euo pipefail
          name=$(jq -r '.date + "-" + .stage' main/latest.json)
          if ! printf '%s' "$name" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}-(premarket|open)$'; then echo "::error::unexpected date or stage: $name"; exit 1; fi
          mkdir -p archive/archive
          cp main/latest.json "archive/archive/$name.json"
          cd archive
          ls archive | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}-(premarket|open)\.json$' | sort | jq -R . | jq -s --arg u "$name" '{updated: $u, files: .}' > index.json
          git config user.name "steelygamma-archive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive index.json
          git diff --cached --quiet || (git commit -m "Archive $name" && git push origin HEAD:archive)
