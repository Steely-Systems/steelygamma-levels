name: archive levels
# Keeps every published latest.json on the `archive` branch as archive/YYYY-MM-DD-<stage>.json, with index.json listing them, so the
# levels can be checked against what the market did later. Runs when latest.json changes on main; it never commits to main, so the
# publisher's pushes to main are unaffected. Since 2026-11-20 latest-v2.json is kept the same way under archive/v2/ (index-v2.json).
on:
  push:
    branches: [main]
    paths: [latest.json, latest-v2.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: main
      - uses: actions/checkout@v5
        with:
          ref: archive
          path: archive
      - name: Copy latest.json and latest-v2.json into the archive
        run: |
          set -euo pipefail
          check() { printf '%s' "$1" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}-(premarket|open)$' || { echo "::error::unexpected date or stage: $1"; exit 1; }; }
          name=$(jq -r '.date + "-" + .stage' main/latest.json); check "$name"
          mkdir -p archive/archive/v2
          cp main/latest.json "archive/archive/$name.json"
          name2=""
          if [ -f main/latest-v2.json ]; then name2=$(jq -r '.date + "-" + .stage' main/latest-v2.json); check "$name2"; cp main/latest-v2.json "archive/archive/v2/$name2.json"; fi
          cd archive
          ls archive | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}-(premarket|open)\.json$' | sort | jq -R . | jq -s --arg u "$name" '{updated: $u, files: .}' > index.json
          if [ -n "$name2" ]; then ls archive/v2 | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}-(premarket|open)\.json$' | sort | jq -R . | jq -s --arg u "$name2" '{updated: $u, files: .}' > index-v2.json; fi
          git config user.name "steelygamma-archive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive index.json $( [ -n "$name2" ] && echo index-v2.json )
          git diff --cached --quiet || (git commit -m "Archive ${name2:-$name}" && git push origin HEAD:archive)
